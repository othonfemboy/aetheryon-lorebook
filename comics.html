<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Comics - Aetheryon</title>
    <style>
        body { 
            background-color: #050505; /* Fundo escuro combinando com o site */
            color: white; 
            font-family: sans-serif; 
            margin: 0;
            padding-bottom: 50px;
        }
        
        /* Botão pra voltar pra tela principal */
        .botao-voltar {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 8px 16px;
            background: #111;
            color: #ff00ff;
            border: 1px solid #ff00ff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        /* O seu título com letras brilhantes */
        .titulo-brilhante {
            text-align: center;
            font-size: 35px;
            color: #fff;
            text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 40px #ff00ff;
            margin-top: 80px;
            margin-bottom: 40px;
        }

        /* A caixa que organiza as imagens de cima pra baixo */
        .galeria-shorts {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px; /* Espaço entre as imagens */
        }

        .galeria-shorts img {
            max-width: 90%;
            width: 600px; /* Tamanho bom pra não estourar na tela */
            border: 2px solid #333;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- Botão de voltar (aponta de volta pro seu arquivo principal) -->
    <a href="index.html" class="botao-voltar">⬅ Voltar</a>

    <!-- O Título da Comic -->
    <h1 class="titulo-brilhante">O Segredinho da Ashley</h1>

    <!-- As imagens da short -->
    <div class="galeria-shorts">
        <img src="comicpart1.png" alt="Parte 1">
        <img src="comicpart2.png" alt="Parte 2">
        <img src="ashley_art2.png" alt="Parte 3">
        <img src="ashley_art3.jpg" alt="Parte 4">
        <!-- Só ir adicionando mais tags <img> aqui pra baixo -->
    </div>

</body>
</html>
