<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheryon Draft - Batalha de Heróis</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0c;
            color: #fff;
            font-family: 'Roboto', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1, h2, h3 { font-family: 'Cinzel', serif; text-align: center; }
        
        /* CORES DAS CLASSES */
        .vanguard { border-color: #0077ff !important; box-shadow: 0 0 10px rgba(0,119,255,0.5); }
        .striker { border-color: #ff4444 !important; box-shadow: 0 0 10px rgba(255,68,68,0.5); }
        .sustainer { border-color: #00ffcc !important; box-shadow: 0 0 10px rgba(0,255,204,0.5); }

        /* LOBBY */
        #lobby-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100%;
        }

        .btn-neon {
            background: transparent;
            color: #a855f7;
            border: 2px solid #a855f7;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            margin: 10px;
        }
        .btn-neon:hover { background: rgba(168, 85, 247, 0.2); box-shadow: 0 0 15px rgba(168, 85, 247, 0.6); }

        /* ARENA (Escondida no início) */
        #arena-screen {
            display: none;
            flex-direction: column;
            width: 100%;
            max-width: 1000px;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .mesa-draft {
            flex-grow: 1;
            border: 2px dashed #444;
            border-radius: 15px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding: 20px;
            margin: 20px 0;
            background: rgba(255,255,255,0.02);
        }

        .carta {
            width: 120px;
            height: 180px;
            background: #111;
            border: 2px solid #555;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            cursor: pointer;
            transition: 0.2s;
            box-sizing: border-box;
        }
        .carta:hover { transform: translateY(-10px); }
        .carta h4 { margin: 0; font-size: 0.9rem; color: #fff; font-family: 'Cinzel', serif; }
        .carta .classe { font-size: 0.7rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .carta .img-placeholder { width: 100%; height: 80px; background: #222; border-radius: 5px; }

    </style>
</head>
<body>

    <!-- TELA DE LOBBY -->
    <div id="lobby-screen">
        <h1 style="color: #a855f7; font-size: 3rem; margin-bottom: 5px;">AETHERYON DRAFT</h1>
        <p style="color: #888; margin-bottom: 40px;">Recrute seus heróis. Preveja o inimigo. Vença o duelo.</p>
        
        <button class="btn-neon" onclick="criarSala()">Criar Partida</button>
        
        <div style="margin-top: 20px; display: flex; gap: 10px;">
            <input type="text" id="codigo-sala" placeholder="Código da Sala" style="padding: 15px; background: #111; color: #fff; border: 1px solid #555; border-radius: 8px; font-family: 'Cinzel', serif; text-transform: uppercase; text-align: center; width: 150px;">
            <button class="btn-neon" style="color: #00ffcc; border-color: #00ffcc;" onclick="entrarNaSala()">Entrar</button>
        </div>
        <p id="lobby-status" style="margin-top: 20px; color: #aaa; font-style: italic;"></p>
    </div>

    <!-- TELA DA ARENA -->
    <div id="arena-screen">
        <h2 id="fase-titulo" style="color: #00ffcc;">Fase 1: Recrutamento (Draft)</h2>
        <p id="status-turno" style="text-align: center; color: #a855f7; font-size: 1.2rem;">Aguardando oponentes...</p>
        
        <div class="mesa-draft" id="mercado-herois">
            <!-- As cartas para escolher aparecerão aqui -->
        </div>

        <div style="display: flex; justify-content: space-between; width: 100%; margin-top: auto;">
            <div>
                <h3 style="color: #ff4444; margin-bottom: 5px;">Adversário</h3>
                <div id="mao-adversario" style="display: flex; gap: 10px;"></div>
            </div>
            <div style="text-align: right;">
                <h3 style="color: #00ffcc; margin-bottom: 5px;">Sua Mão</h3>
                <div id="mao-jogador" style="display: flex; gap: 10px;"></div>
            </div>
        </div>
    </div>

    <!-- FIREBASE E MOTOR DO JOGO -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCmAkdBLKuoegQOpILl7isbmblPZMQ6huk",
            authDomain: "aetheryon-lore.firebaseapp.com",
            projectId: "aetheryon-lore",
            storageBucket: "aetheryon-lore.firebasestorage.app",
            messagingSenderId: "581206693394",
            appId: "1:581206693394:web:85fcb86ea7aa3457742acb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // O GRIMÓRIO (Com 10 heróis, puxando as cores do seu CSS pelas classes)
        const grimorioCartas = [
            { id: 1, nome: "Ashlan", classe: "Striker", tipo: "striker", icone: "⚔️" },
            { id: 2, nome: "Scarlett", classe: "Sustainer", tipo: "sustainer", icone: "✨" },
            { id: 3, nome: "Ashton", classe: "Vanguard", tipo: "vanguard", icone: "🛡️" },
            { id: 4, nome: "Tharion", classe: "Striker", tipo: "striker", icone: "⚔️" },
            { id: 5, nome: "Elara", classe: "Sustainer", tipo: "sustainer", icone: "✨" },
            { id: 6, nome: "Grom", classe: "Vanguard", tipo: "vanguard", icone: "🛡️" },
            { id: 7, nome: "Kael", classe: "Striker", tipo: "striker", icone: "⚔️" },
            { id: 8, nome: "Lyra", classe: "Sustainer", tipo: "sustainer", icone: "✨" },
            { id: 9, nome: "Drax", classe: "Vanguard", tipo: "vanguard", icone: "🛡️" },
            { id: 10, nome: "Nyx", classe: "Striker", tipo: "striker", icone: "⚔️" }
        ];

        let salaAtualID = null;
        let meuPapel = null;

        // =========================================
        // LÓGICA DO LOBBY (CRIAR E ENTRAR)
        // =========================================
        window.criarSala = async function() {
            const statusText = document.getElementById('lobby-status');
            statusText.innerText = "Criando portal...";
            
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let novoCodigo = '';
            for (let i = 0; i < 5; i++) novoCodigo += chars.charAt(Math.floor(Math.random() * chars.length));
            
            try {
                await setDoc(doc(db, "lobbies_draft", novoCodigo), {
                    status: "aguardando",
                    turnoAtual: "jogador1",
                    mercado: grimorioCartas, // Joga os 10 heróis no centro da mesa
                    maoJogador1: [],
                    maoJogador2: []
                });
                salaAtualID = novoCodigo; 
                meuPapel = 'jogador1';
                statusText.innerHTML = `Sala criada! Código: <span style="color: #fff; font-size: 1.5rem;">${novoCodigo}</span>`;
                ouvirSala(novoCodigo);
            } catch (error) { 
                statusText.innerText = "Erro ao criar portal."; 
                console.error(error);
            }
        };

        window.entrarNaSala = async function() {
            const codigo = document.getElementById('codigo-sala').value.toUpperCase().trim();
            const statusText = document.getElementById('lobby-status');
            if (codigo.length !== 5) { statusText.innerText = "Código deve ter 5 caracteres."; return; }
            statusText.innerText = "Conectando...";
            
            try {
                const salaRef = doc(db, "lobbies_draft", codigo);
                const salaSnap = await getDoc(salaRef);
                if (salaSnap.exists() && salaSnap.data().status === "aguardando") {
                    await updateDoc(salaRef, { status: "drafting" });
                    salaAtualID = codigo; 
                    meuPapel = 'jogador2';
                    ouvirSala(codigo);
                } else { 
                    statusText.innerText = "Sala cheia ou inexistente."; 
                }
            } catch (error) { 
                statusText.innerText = "Erro de conexão."; 
            }
        }

        // =========================================
        // MOTOR GRÁFICO (DESENHAR AS CARTAS)
        // =========================================
        function criarElementoCarta(heroi, divDestino, acaoClique) {
            const carta = document.createElement('div');
            // Junta a classe base 'carta' com o tipo do herói pra puxar a cor neon do CSS
            carta.className = `carta ${heroi.tipo}`; 
            
            carta.innerHTML = `
                <div style="font-size: 30px; margin-bottom: 5px;">${heroi.icone}</div>
                <h4 style="color: #fff; font-family: 'Cinzel', serif; margin: 0;">${heroi.nome}</h4>
                <span style="font-size: 10px; font-weight: bold; text-transform: uppercase; color: #aaa; margin-top: 5px;">${heroi.classe}</span>
            `;
            
            if (acaoClique) {
                carta.onclick = () => acaoClique(heroi);
            }
            
            divDestino.appendChild(carta);
        }

        // =========================================
        // ESCUTAR O FIREBASE E ATUALIZAR A MESA
        // =========================================
        function ouvirSala(codigo) {
            onSnapshot(doc(db, "lobbies_draft", codigo), async (docSnap) => {
                if (docSnap.exists()) {
                    const dados = docSnap.data();
                    
                    if (dados.status === "drafting") {
                        // Troca de tela
                        document.getElementById('lobby-screen').style.display = 'none';
                        document.getElementById('arena-screen').style.display = 'flex';
                        
                        // Elementos da tela
                        const turnoText = document.getElementById('status-turno');
                        const mercadoDiv = document.getElementById('mercado-cartas');
                        const maoJogadorDiv = document.getElementById('mao-jogador');
                        const maoAdversarioDiv = document.getElementById('mao-adversario');
                        
                        // Limpa a mesa antes de redesenhar
                        mercadoDiv.innerHTML = '';
                        maoJogadorDiv.innerHTML = '';
                        maoAdversarioDiv.innerHTML = '';

                        // 1. Atualiza o letreiro de quem é o turno
                        if (dados.turnoAtual === meuPapel) {
                            turnoText.innerText = "Sua Vez de Escolher!";
                            turnoText.style.color = "#00ffcc";
                        } else {
                            turnoText.innerText = "Adversário está escolhendo...";
                            turnoText.style.color = "#ff4444";
                        }

                        // 2. Desenha o Mercado e liga o clique no Firebase
                        dados.mercado.forEach(heroi => {
                            criarElementoCarta(heroi, mercadoDiv, async (heroiClicado) => {
                                // Trava de segurança: só deixa recrutar se for o seu turno
                                if (dados.turnoAtual !== meuPapel) {
                                    alert("Calma apressado! Não é o seu turno ainda.");
                                    return;
                                }
                                
                                // Tira o herói do mercado e joga pra sua mão
                                const novoMercado = dados.mercado.filter(item => item.id !== heroiClicado.id);
                                const minhaMao = meuPapel === 'jogador1' ? dados.maoJogador1 : dados.maoJogador2;
                                minhaMao.push(heroiClicado);
                                
                                // Passa a vez
                                const proximoTurno = meuPapel === 'jogador1' ? 'jogador2' : 'jogador1';
                                
                                // Atualiza tudo lá no Firebase
                                await updateDoc(doc(db, "lobbies_draft", salaAtualID), {
                                    mercado: novoMercado,
                                    [meuPapel === 'jogador1' ? 'maoJogador1' : 'maoJogador2']: minhaMao,
                                    turnoAtual: proximoTurno
                                });
                            });
                        });

                        // 3. Desenha a sua mão e a do seu adversário
                        const minhaMaoArr = meuPapel === 'jogador1' ? dados.maoJogador1 : dados.maoJogador2;
                        const maoAdversarioArr = meuPapel === 'jogador1' ? dados.maoJogador2 : dados.maoJogador1;

                        minhaMaoArr.forEach(heroi => criarElementoCarta(heroi, maoJogadorDiv, null));
                        maoAdversarioArr.forEach(heroi => criarElementoCarta(heroi, maoAdversarioDiv, null));
                    }
                }
            });
        }
    </script>
</body>
</html>
