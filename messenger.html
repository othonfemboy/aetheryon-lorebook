<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetheryon Messenger</title>

  <style>
    /* O MESMO VISUAL BOOSTED DE ANTES */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); height: 100vh; display: flex; justify-content: center; align-items: center; color: #e2e8f0; overflow: hidden; }
    .messenger-app { width: 90vw; height: 85vh; background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(0, 255, 255, 0.2); border-radius: 20px; backdrop-filter: blur(16px); box-shadow: 0 0 30px rgba(0, 0, 0, 0.7); display: grid; grid-template-columns: 240px 1fr 420px; overflow: hidden; }
    
    .sidebar { background: rgba(0, 0, 0, 0.3); border-right: 1px solid rgba(255, 255, 255, 0.08); padding: 20px; }
    .contact { padding: 12px; border-radius: 8px; cursor: pointer; transition: 0.2s; margin-bottom: 6px; }
    .contact.active { background: rgba(0, 255, 255, 0.1); border: 1px solid rgba(0, 255, 255, 0.3); }
    .status-online { color: #4ade80; font-size: 0.8em; }

    .chat-area { display: flex; flex-direction: column; padding: 25px; background: rgba(0, 0, 0, 0.15); }
    .chat-header { border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 15px; margin-bottom: 20px; }
    
    .chat-history { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; padding-right: 10px; }
    .chat-history::-webkit-scrollbar { width: 6px; }
    .chat-history::-webkit-scrollbar-thumb { background: rgba(0, 255, 255, 0.3); border-radius: 10px; }

    .balao { max-width: 75%; padding: 12px 16px; border-radius: 15px; font-size: 0.95em; line-height: 1.4; animation: fadeIn 0.3s ease; }
    .balao-jogador { background: #0ea5e9; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
    .balao-byakuya { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255,255,255,0.2); color: #e2e8f0; align-self: flex-start; border-bottom-left-radius: 2px; }
    .balao-sistema { background: transparent; color: #94a3b8; font-size: 0.8em; align-self: center; font-style: italic; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .chat-input-container { margin-top: 15px; display: flex; gap: 10px; }
    .chat-input-container input { flex: 1; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(0, 255, 255, 0.3); padding: 14px; border-radius: 8px; color: white; outline: none; }
    .btn-enviar { background: #0ea5e9; color: white; border: none; padding: 0 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .btn-enviar:disabled { background: #475569; cursor: not-allowed; }

    .model-area { position: relative; background: radial-gradient(circle at 50% 40%, rgba(20, 184, 166, 0.15) 0%, rgba(15, 23, 42, 0.9) 80%); border-left: 1px solid rgba(255, 255, 255, 0.08); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .glow-fundo { position: absolute; width: 350px; height: 350px; background: rgba(0, 255, 255, 0.15); filter: blur(80px); border-radius: 50%; z-index: 1; }
    .personagem-retrato { position: relative; z-index: 2; max-height: 85%; max-width: 90%; object-fit: contain; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8)); }
    .hud-afinidade { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); z-index: 10; text-align: center; background: rgba(10, 15, 30, 0.75); padding: 12px 20px; border-radius: 15px; border: 1px solid rgba(0, 255, 255, 0.3); backdrop-filter: blur(8px); }
    .coracoes { color: #ff4757; font-size: 22px; letter-spacing: 3px; margin-bottom: 8px; }
    .btn-acao { background: #1e293b; color: #00ffff; border: 1px solid #00ffff; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-acao.secreta { background: #ff4757; border-color: #ff4757; color: #fff; }
  </style>
</head>
<body>

  <div class="messenger-app">
    <aside class="sidebar">
      <h3 style="margin-bottom: 20px; color: #00ffff; letter-spacing: 1px;">CONTATOS</h3>
      <div class="contact active">
        <div>Byakuya</div>
        <div class="status-online">● Online</div>
      </div>
      <div class="contact">
        <div>Ashlan Lancehearth</div>
        <div class="status-online">● Online</div>
      </div>
    </aside>

    <main class="chat-area">
      <div class="chat-header">
        <h2 style="color: #fff;">Byakuya</h2>
        <div id="relacionamento-label" style="font-size: 0.9em; color: #94a3b8; margin-top: 5px;">Relacionamento: Amiga</div>
      </div>
      
      <div class="chat-history" id="chat-box"></div>
      
      <div class="chat-input-container">
        <input type="text" id="input-mensagem" placeholder="Digite uma mensagem para ela... ➤" onkeypress="verificarEnter(event)">
        <button id="btn-enviar" class="btn-enviar" onclick="enviarMensagem()">Enviar</button>
      </div>
    </main>

    <section class="model-area">
      <div class="glow-fundo"></div>
      <img id="byakuya-img" src="byakuya.png" alt="Byakuya" class="personagem-retrato">
      <div class="hud-afinidade">
        <div id="coracoes-display" class="coracoes">♥♥♥♡♡</div>
        <button onclick="darPresente()" id="btn-presente" class="btn-acao">🎁 Dar Presente</button>
        <button onclick="equiparBiquini()" id="btn-biquini" class="btn-acao secreta" style="display: none;">👙 Skin: Biquíni</button>
      </div>
    </section>
  </div>

  <script>
    // ==========================================
    // 1. VOICES
    // ==========================================    
    
    let afinidade = 3;
    const chatBox = document.getElementById('chat-box');
    const inputMsg = document.getElementById('input-mensagem');
    const btnEnviar = document.getElementById('btn-enviar');

    // Banco de áudios de reação (as vozes da sua prima)
    const audiosDeReacao = [
      "voicelines/byakuya_intro.mp3",
      "voicelines/byakuya_mongeseguir.mp3",
      "voicelines/byakuya_tentarsorte.mp3",
      "voicelines/byakuya_putinha.mp3",
      "voicelines/byakuya_lamberpes.mp3"
    ];

    function verificarEnter(e) {
      if (e.key === 'Enter') enviarMensagem();
    }

    async function enviarMensagem() {
      const texto = inputMsg.value.trim();
      if (texto === "" || btnEnviar.disabled) return;

      adicionarBalao(texto, 'balao-jogador');
      inputMsg.value = ""; 
      
      // Bloqueia o input enquanto ela "digita"
      btnEnviar.disabled = true;
      inputMsg.placeholder = "Byakuya está digitando...";

      // Chama a IA do Gemini
      await consultarMenteDaByakuya(texto);

      // Desbloqueia o input
      btnEnviar.disabled = false;
      inputMsg.placeholder = "Digite uma mensagem para ela... ➤";
      inputMsg.focus();
    }

    async function consultarMenteDaByakuya(mensagemJogador) {
      // Agora o HTML pede a resposta para o seu próprio servidor da Vercel
      try {
        const resposta = await fetch('/api/chat', {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mensagem: mensagemJogador })
        });

        const dados = await resposta.json();
        
        if (dados.candidates && dados.candidates.length > 0) {
          const textoByakuya = dados.candidates[0].content.parts[0].text;
          
          adicionarBalao(textoByakuya, 'balao-byakuya');
          tocarReacaoEmAudio();
        } else {
          adicionarBalao("Byakuya te ignorou friamente. (Sem resposta da IA)", 'balao-sistema');
        }
      } catch (erro) {
        console.error("Erro no chat:", erro);
        adicionarBalao("Byakuya estalou a língua e virou o rosto. (Erro no servidor)", 'balao-sistema');
      }
    }

    function tocarReacaoEmAudio() {
      const audioSorteado = audiosDeReacao[Math.floor(Math.random() * audiosDeReacao.length)];
      const player = new Audio(audioSorteado);
      player.volume = 0.8;
      player.play().catch(e => console.log("Áudio bloqueado até interação:", e));
    }

    function adicionarBalao(texto, classeEstilo) {
      const div = document.createElement('div');
      div.className = `balao ${classeEstilo}`;
      div.innerText = texto;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // ----- Lógica da Afinidade e Presentes -----
    function darPresente() {
      if (afinidade < 5) {
        afinidade++;
        atualizarHUD();
        adicionarBalao("Você ofereceu uma oferenda humilde.", 'balao-sistema');
      }
      if (afinidade === 5) {
        document.getElementById('btn-presente').style.display = 'none';
        document.getElementById('btn-biquini').style.display = 'inline-block';
        document.getElementById('relacionamento-label').innerText = "Relacionamento: Devoção Máxima";
        adicionarBalao("A Monge de Ferro aceitou sua devoção completa.", 'balao-sistema');
      }
    }

    function atualizarHUD() {
      const display = document.getElementById('coracoes-display');
      if (afinidade === 4) display.innerText = "♥♥♥♥♡";
      if (afinidade === 5) display.innerText = "♥♥♥♥♥";
    }

    function equiparBiquini() {
      const imagem = document.getElementById('byakuya-img');
      imagem.src = "byakuya_biquini.png"; 
      
      const audio = new Audio("voicelines/byakuya_coxas.mp3");
      audio.play();
      adicionarBalao("Sua recompensa por ser um servo fiel...", 'balao-byakuya');
    }
  </script>

</body>
</html>
