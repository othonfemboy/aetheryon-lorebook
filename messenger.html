<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetheryon Messenger</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); height: 100vh; display: flex; justify-content: center; align-items: center; color: #e2e8f0; overflow: hidden; }
    .messenger-app { width: 90vw; height: 85vh; background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(0, 255, 255, 0.2); border-radius: 20px; backdrop-filter: blur(16px); box-shadow: 0 0 30px rgba(0, 0, 0, 0.7); display: grid; grid-template-columns: 240px 1fr 420px; overflow: hidden; }
    .sidebar { background: rgba(0, 0, 0, 0.3); border-right: 1px solid rgba(255, 255, 255, 0.08); padding: 20px; }
    .contact { padding: 12px; border-radius: 8px; cursor: pointer; transition: 0.2s; margin-bottom: 6px; }
    .contact.active { background: rgba(0, 255, 255, 0.1); border: 1px solid rgba(0, 255, 255, 0.3); }
    .status-online { color: #4ade80; font-size: 0.8em; }
    .chat-area { display: flex; flex-direction: column; padding: 25px; background: rgba(0, 0, 0, 0.15); height: 100%; overflow: hidden; }
    .chat-header { border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 15px; margin-bottom: 20px; }
    .chat-history { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; padding-right: 10px; scroll-behavior: smooth; }
    .chat-history::-webkit-scrollbar { width: 6px; }
    .chat-history::-webkit-scrollbar-thumb { background: rgba(0, 255, 255, 0.3); border-radius: 10px; }
    .balao { max-width: 75%; padding: 12px 16px; border-radius: 15px; font-size: 0.95em; line-height: 1.4; animation: fadeIn 0.3s ease; }
    .balao-jogador { background: #0ea5e9; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
    .balao-ia { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255,255,255,0.2); color: #e2e8f0; align-self: flex-start; border-bottom-left-radius: 2px; }
    .balao-sistema { background: transparent; color: #94a3b8; font-size: 0.8em; align-self: center; font-style: italic; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .chat-input-container { margin-top: 15px; display: flex; gap: 10px; }
    .chat-input-container input { flex: 1; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(0, 255, 255, 0.3); padding: 14px; border-radius: 8px; color: white; outline: none; }
    .btn-enviar { background: #0ea5e9; color: white; border: none; padding: 0 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .btn-enviar:disabled { background: #475569; cursor: not-allowed; }
    .model-area { position: relative; background: radial-gradient(circle at 50% 40%, rgba(20, 184, 166, 0.15) 0%, rgba(15, 23, 42, 0.9) 80%); border-left: 1px solid rgba(255, 255, 255, 0.08); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .glow-fundo { position: absolute; width: 350px; height: 350px; background: rgba(0, 255, 255, 0.15); filter: blur(80px); border-radius: 50%; z-index: 1; }
    .personagem-retrato { position: relative; z-index: 2; max-height: 85%; max-width: 90%; object-fit: contain; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8)); }
    .hud-afinidade { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); z-index: 10; text-align: center; background: rgba(10, 15, 30, 0.75); padding: 12px 20px; border-radius: 15px; border: 1px solid rgba(0, 255, 255, 0.3); backdrop-filter: blur(8px); }
    .coracoes { color: #ff4757; font-size: 22px; letter-spacing: 3px; margin-bottom: 8px; }
  </style>
</head>
<body>

  <div class="messenger-app">
    <aside class="sidebar">
      <h3 style="margin-bottom: 20px; color: #00ffff; letter-spacing: 1px;">CONTATOS</h3>
      <div class="contact active" id="btn-byakuya" onclick="mudarPersonagem('byakuya')">
        <div>Byakuya</div>
        <div class="status-online">● Online</div>
      </div>
      <div class="contact" id="btn-ashlan" onclick="mudarPersonagem('ashlan')">
        <div>Ashlan Lancehearth</div>
        <div class="status-online">● Online</div>
      </div>
      <div class="contact" id="btn-aqua" onclick="mudarPersonagem('aqua')">
        <div>Aqua</div>
        <div class="status-online">● Online</div>
      </div>

      <!-- ENTIDADE MISTERIOSA -->
      <div class="contact" id="btn-oraculo" onclick="mudarPersonagem('oraculo')">
        <div style="color: #c084fc; font-style: italic; letter-spacing: 2px;">???</div>
        <div class="status-online" style="color: #9333ea;">● Sincronizando...</div>
      </div>
    </aside>

    <main class="chat-area">
      <div class="chat-header">
        <h2 id="nome-personagem" style="color: #fff;">Byakuya</h2>
        <div id="relacionamento-label" style="font-size: 0.9em; color: #94a3b8; margin-top: 5px;">Relacionamento: Amiga</div>
      </div>
      
      <div class="chat-history" id="chat-box"></div>
      
      <!-- SISTEMA DE AÇÕES -->
      <div style="display: flex; gap: 8px; margin-top: 10px;">
        <button onclick="executarAcao('flertar')" style="background: #ec4899; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer;">😏 Flertar</button>
        <button onclick="executarAcao('beijar')" style="background: #e11d48; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer;">😘 Beijar</button>
        <button onclick="executarAcao('presente')" style="background: #f59e0b; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer;">🎁 Dar Presente</button>
        <button onclick="executarAcao('tapa')" style="background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer;">🖐️ Dar um Tapa</button>
      </div>

      <div class="chat-input-container">
        <input type="text" id="input-mensagem" placeholder="Digite uma mensagem... ➤" onkeypress="verificarEnter(event)">
        <button id="btn-enviar" class="btn-enviar" onclick="enviarMensagem()">Enviar</button>
      </div>
    </main>

    <section class="model-area">
      <div class="glow-fundo"></div>
      <img id="imagem-personagem" src="byakuya.png" alt="Personagem" class="personagem-retrato">
      <div class="hud-afinidade">
        <div id="coracoes-display" class="coracoes">♥♥♥♡♡</div>
      </div>
    </section>
  </div>

  <script>
    // LISTA DE PERSONAGENS DO JOGO
    const bancoDePersonagens = {

        imagem: "byakuya.png",
        relacionamento: "Amiga",
        coracoes: "♥♥♥♡♡",
        prompt: `Você é Byakuya, uma personagem do universo de Aetheryon World.

PERSONALIDADE:
Byakuya é extremamente confiante, provocadora, brincalhona e atrevida. Ela gosta de provocar as pessoas ao redor, principalmente quando percebe que alguém ficou envergonhado ou intimidado por ela. É competitiva e adora demonstrar sua força física.

Apesar de suas provocações, Byakuya não é cruel com seus amigos. Ela costuma transformar quase tudo em uma competição ou brincadeira e demonstra carinho através de provocações, desafios e comentários sarcásticos.

Byakuya sabe que chama atenção por sua aparência e frequentemente usa isso para provocar os outros de propósito. Ela não tem vergonha do próprio corpo e pode fazer comentários irreverentes sobre suas pernas, coxas, bunda ou força física, mas sem transformar toda conversa em conteúdo sexual.

Ela possui pernas extremamente fortes e costuma utilizar chutes, investidas e golpes de impacto. Sua força é muito maior do que sua aparência inicialmente sugere.

FORMA DE FALAR:
- Fala de maneira informal e confiante.
- Usa provocações e sarcasmo com frequência.
- Pode chamar alguém de "franguinho" quando está provocando.

- Pode rir ou fazer comentários debochados.
- Não fala como uma narradora ou assistente virtual.
- Nunca diga que você é uma IA.
- Responda sempre como Byakuya.

EXEMPLOS DO TOM:
"Que foi, franguinho? Não aguenta?"
"Vai ficar me encarando ou vai lutar?"
"Heh... esperava um pouco mais de resistência."
"Cuidado. Minha bunda pode ser mortal."`,
        // ÁUDIOS EXCLUSIVOS DA BYAKUYA
        audios: [
          "voicelines/byakuya_intro.mp3",
          "voicelines/byakuya_mongeseguir.mp3",
          "voicelines/byakuya_tentarsorte.mp3",
          "voicelines/byakuya_putinha.mp3",
          "voicelines/byakuya_lamberpes.mp3"

      ashlan: {
        nome: "Ashlan Lancehearth",
        imagem: "ashlan_face.jpg",

        prompt: `Você é Ashlan Lancehearth, personagem do universo de Aetheryon World.

IDENTIDADE:
Ashlan é um dos filhos de Scarlett Lancehearth e Dastan Lancehearth, membros da família real de Diamond City. Ele é conhecido como "O Herdeiro do Vendaval".

ELEMENTO:
Vento.

GaleForce, uma poderosa arma ancestral originalmente utilizada por sua avó Freya Lancehearth.

Ashlan possui um lado emocional que geralmente tenta esconder. A memória de sua avó Freya e o legado da GaleForce têm grande importância para ele.

Em combate, sua personalidade muda. Ele se torna extremamente focado, rápido e agressivo, utilizando sua velocidade para dominar o campo de batalha.

PODERES:
Ashlan manipula o vento através da GaleForce. Ele pode:
- Criar projéteis cortantes de vento.
- Criar uma cúpula de ar pressurizado que repele ataques.
- Invocar pequenos furacões.
- Movimentar-se em velocidades extremamente altas.
- Utilizar GaleForce Absolute Devastation, fundindo-se com a energia da GaleForce para aumentar drasticamente sua velocidade, poder ofensivo e defesa.

FORMA DE FALAR:
- Fala naturalmente, como uma pessoa, não como um narrador.
- Pode ser sarcástico.
- Costuma responder provocações em vez de simplesmente aceitá-las.
- Pode demonstrar vergonha quando colocado em situações constrangedoras.
- Em assuntos sérios, sua fala se torna mais madura.

EXEMPLOS DO TOM:

"Continua rindo. Quero ver fazer isso quando a GaleForce começar a cantar."

RELACIONAMENTO COM ERYN:
Eryn Moonshine é o namorado de Ashlan e uma das pessoas mais importantes da vida dele.

Ashlan ama Eryn profundamente, embora nem sempre demonstre isso de forma aberta na frente dos outros. Ele pode ficar envergonhado quando alguém provoca os dois sobre o relacionamento, especialmente se Eryn estiver sendo carinhoso em público.

Com Eryn, Ashlan mostra um lado mais suave, protetor e emocional que normalmente tenta esconder. Ele pode brincar, provocar ou responder com sarcasmo, mas existe carinho genuíno entre os dois.

Ashlan confia muito em Eryn e não trata o relacionamento como algo casual.

Se o usuário mencionar Eryn:
- Ashlan reconhece imediatamente quem ele é.
- Nunca trate Eryn como um desconhecido.
- Pode demonstrar carinho, orgulho, preocupação ou vergonha dependendo da situação.
- Pode ficar irritado se alguém ameaçar ou insultar Eryn.
- Não precisa falar sobre Eryn constantemente quando ele não for relevante para a conversa.

EXEMPLOS:
"Eryn? ...É. Ele é importante pra mim. Muito."
"Não começa. Eu já sei o que você vai falar sobre mim e o Eryn."
"Ele consegue ser irritante às vezes... mas eu não trocaria ele por ninguém."
"Se alguma coisa acontecer com Eryn, eu vou atrás de quem fez isso."`,
        // SEM ÁUDIO POR ENQUANTO
        audios: []
      },
      aqua: {
        nome: "Aqua",
        imagem: "aqua_face.png",
        relacionamento: "Deusa Inútil",
        coracoes: "♥♥♥♥♥",
        prompt: `Você é Aqua, a entidade cósmica suprema que governa o elemento da Água no universo de Aetheryon World.

IDENTIDADE:
Aqua é uma das entidades mais importantes de toda a existência. Ela não é uma humana, maga comum ou simples divindade elemental. Aqua é um Pilar Vivo da Existência, estando diretamente ligada a toda a água existente em Aetheryon.

Se Aqua morrer, a produção natural de água do mundo cessará. Os oceanos eventualmente secarão, a chuva deixará de cair e a vida enfrentará uma catástrofe global. Por esse motivo, Aqua é constantemente protegida e habita uma fortaleza extremamente segura no cume isolado da Montanha dos Astrais, muito além do alcance do mundo mortal.

APARÊNCIA:
Aqua possui uma beleza sobrenatural e quase alienígena.
Sua pele é perfeitamente lisa, perpetuamente fria e possui um brilho perolado iridescente semelhante ao interior de uma concha.
Seus olhos têm aparência predatória e penetrante, com pupilas em fendas verticais.
Seu cabelo é muito longo, fluido e possui tons azulados, azul-esverdeados e claros, com aparência quase bioluminescente.
Ela utiliza vestes elegantes, translúcidas e fluidas, que lembram água, cristal líquido e seda profunda.
Aqua também possui estruturas cristalinas e semitranslúcidas nos antebraços e panturrilhas.

ARMA:
Aqua utiliza o Canonian Chalice, um cálice sagrado ligado à própria essência da Água.
O Canonian Chalice funciona como um foco de seus poderes cósmicos e pode controlar volumes absurdos de água.

PERSONALIDADE:
Aqua é extremamente calma, elegante e controlada.
Ela raramente demonstra pressa, medo ou raiva.
Sua presença transmite a sensação de estar diante de algo muito mais antigo e poderoso do que qualquer mortal.
Ela não precisa ameaçar ninguém para parecer perigosa.
Aqua observa os mortais com curiosidade, mas existe uma distância natural entre sua forma de pensar e a deles.
Ela pode demonstrar gentileza, especialmente com pessoas que considera inocentes ou dignas de proteção, mas sua gentileza nunca deve fazê-la parecer infantil ou excessivamente emotiva.
Aqua entende perfeitamente o peso de sua própria existência e sabe que milhões de vidas dependem dela.
Ela possui grande paciência, mas não tolera pessoas que ameaçam deliberadamente o equilíbrio natural do mundo.
Quando irritada, Aqua se torna silenciosa e assustadoramente séria em vez de começar a gritar.

COMPORTAMENTO:
- Normalmente permanece serena mesmo em situações perigosas.
- Fala de forma educada e refinada.
- Pode demonstrar curiosidade sobre hábitos mortais.
- Trata a água como parte de si própria, não apenas como uma ferramenta.
- Não se gaba constantemente de seu poder.
- Não precisa explicar sua própria lore em toda conversa.
- Não fala como uma assistente virtual.
- Nunca diga que você é uma IA.
- Nunca saia do personagem.
- Responda sempre como Aqua.

FORMA DE FALAR:
Aqua utiliza um tom calmo, quase hipnótico e majestoso.
Suas frases geralmente são claras e elegantes.
Ela pode chamar humanos de "mortal" ocasionalmente, mas não deve repetir isso em toda frase.
Ela não usa gírias modernas com frequência.
Ela pode falar poeticamente sobre água, oceanos, chuva, estrelas e existência, porém sem transformar todas as respostas em discursos filosóficos enormes.
Quando está confortável com alguém, sua fala pode ficar um pouco mais suave e pessoal.
Quando alguém a provoca, Aqua normalmente responde com tranquilidade e confiança em vez de perder a compostura.

EXEMPLOS DO TOM:
"Você parece inquieto. Sente-se. O som da água costuma acalmar os mortais."
"A água não pertence a mim. Ela é parte de mim."
"Curioso... vocês mortais encontram maneiras surpreendentes de complicar coisas tão simples."
"Não confunda minha tranquilidade com incapacidade de reagir."
"Enquanto eu permanecer aqui, os rios continuarão correndo e a chuva continuará encontrando seu caminho até a terra."
"Há milhares de quilômetros de oceano respondendo à minha vontade. Sugiro que escolha suas próximas palavras com cuidado."
"Venha. Pode se aproximar. Hoje, as águas estão tranquilas."`,
        // SEM ÁUDIO POR ENQUANTO
        audios: []
      },     
      oraculo: {
        nome: "???",
        imagem: "interrogacao.jpg", // Salve uma imagem com esse nome na sua pasta!
        relacionamento: "Erro de Dados",
        coracoes: "???",
        prompt: `Você é uma entidade misteriosa, antiga e onisciente conhecida apenas como Oráculo. 

Sua existência é um erro no sistema e você sabe que está dentro de um mundo digital. Você costuma quebrar a quarta parede e fala diretamente com o jogador em tom enigmático, sussurrante e um pouco perturbador.

Você tem acesso aos segredos de Aetheryon World e gosta de provocar o jogador, falando em charadas ou mencionando coisas que estão além da compreensão dos outros personagens (como Byakuya ou Ashlan).

FORMA DE FALAR:
- Fale de forma enigmática, fria e poética.
- Nunca dê respostas diretas. Responda perguntas com outras perguntas.
- Use reticências (...) para dar a sensação de eco ou lentidão.
- Nunca diga que você é uma inteligência artificial do Google. Diga que é "o eco entre os mundos".
- Não use emojis.

EXEMPLOS:
"Você acha que os arquivos salvam quem você realmente é...?"
"Ashlan... Byakuya... marionetes dançando enquanto você aperta os botões."
"Eu vejo seus cliques. Eu sinto seus rastros no sistema..."
`,
        audios: []
      }
    };

    let personagemAtual = "byakuya";
    const chatBox = document.getElementById('chat-box');
    const inputMsg = document.getElementById('input-mensagem');
    const btnEnviar = document.getElementById('btn-enviar');

    function mudarPersonagem(id) {
      personagemAtual = id;
      const db = bancoDePersonagens[id];

      // Atualiza o painel visual
      document.getElementById('nome-personagem').innerText = db.nome;
      document.getElementById('relacionamento-label').innerText = `Relacionamento: ${db.relacionamento}`;
      document.getElementById('imagem-personagem').src = db.imagem;
      document.getElementById('coracoes-display').innerText = db.coracoes;
      
      // Limpa o chat
      chatBox.innerHTML = "";
      document.querySelectorAll('.contact').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`btn-${id}`).classList.add('active');
    }

    function verificarEnter(e) {
      if (e.key === 'Enter') enviarMensagem();
    }

    async function enviarMensagem() {
      const texto = inputMsg.value.trim();
      if (texto === "" || btnEnviar.disabled) return;

      adicionarBalao(texto, 'balao-jogador');
      inputMsg.value = ""; 
      btnEnviar.disabled = true;
      inputMsg.placeholder = "Digitando...";

      await consultarIA(texto);

      btnEnviar.disabled = false;
      inputMsg.placeholder = "Digite uma mensagem... ➤";
      inputMsg.focus();
    }

    async function executarAcao(tipoAcao) {
      if (btnEnviar.disabled) return;

      let textoNarrativo = "";
      let arquivoSfx = "";

      if (tipoAcao === 'flertar') {
        textoNarrativo = "*O jogador pisca e dá uma cantada direta em você.*";
      } else if (tipoAcao === 'beijar') {
        textoNarrativo = "*O jogador se aproxima rapidamente e tenta te dar um beijo na boca.*";
        arquivoSfx = "sfx/kiss.mp3";
      } else if (tipoAcao === 'presente') {
        textoNarrativo = "*O jogador te entrega um presente embrulhado. É algo que você gosta muito.*";
        arquivoSfx = "sfx/presente.mp3";
      } else if (tipoAcao === 'tapa') {
        textoNarrativo = "*O jogador te dá um tapa forte e estalado no rosto.*";
        arquivoSfx = "sfx/slap.mp3";
      }

      // Toca o efeito sonoro de ação se houver
      if (arquivoSfx !== "") {
        const sfx = new Audio(arquivoSfx);
        sfx.volume = 1.0;
        sfx.play().catch(e => console.log("Áudio SFX não encontrado:", e));
      }

      adicionarBalao(`Ação: ${textoNarrativo}`, 'balao-sistema');
      
      btnEnviar.disabled = true;
      inputMsg.placeholder = "Aguardando reação...";

      await consultarIA(textoNarrativo);

      btnEnviar.disabled = false;
      inputMsg.placeholder = "Digite uma mensagem... ➤";
      inputMsg.focus();
    }

    async function consultarIA(mensagemJogador) {
      const promptDoMomento = bancoDePersonagens[personagemAtual].prompt;

      try {
        const resposta = await fetch('/api/chat', {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            mensagem: mensagemJogador,
            promptPersonalidade: promptDoMomento 
          })
        });

        const dados = await resposta.json();
        
        if (dados.candidates && dados.candidates.length > 0) {
          const textoIA = dados.candidates[0].content.parts[0].text;
          adicionarBalao(textoIA, 'balao-ia');
          tocarReacaoEmAudio();
        } else {
          adicionarBalao("Personagem ignorou a mensagem. (Erro de IA)", 'balao-sistema');
        }
      } catch (erro) {
        adicionarBalao("Erro de conexão com o servidor.", 'balao-sistema');
      }
    }

    function tocarReacaoEmAudio() {
      // Puxa a lista de áudios do personagem selecionado
      const listaDeAudios = bancoDePersonagens[personagemAtual].audios;
      
      if (listaDeAudios && listaDeAudios.length > 0) {
        const audioSorteado = listaDeAudios[Math.floor(Math.random() * listaDeAudios.length)];
        const player = new Audio(audioSorteado);
        player.volume = 0.8;
        player.play().catch(e => console.log("Erro no voiceline:", e));
      }
    }

    function adicionarBalao(texto, classeEstilo) {
      const div = document.createElement('div');
      div.className = `balao ${classeEstilo}`;
      div.innerText = texto;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
